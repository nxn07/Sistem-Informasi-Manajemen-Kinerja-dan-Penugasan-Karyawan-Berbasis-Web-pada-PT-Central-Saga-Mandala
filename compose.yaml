services:
  # 1. Database PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: postgres-sim
    restart: always
    environment:
      POSTGRES_DB: sim_kinerja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend Laravel (API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-laravel
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sim_kinerja
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword

  # 3. Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-nextjs
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data: